<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Learning Tools &bull; Vocabulary World</title>

  <!-- Progressive Web App (PWA) & Mobile Meta Tags -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#2D5A4C" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Vocabulary World" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="VocabWorld" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />

  <!-- Early PWA Install Prompt Capture: catches event before other scripts finish loading -->
  <script>
    window.__deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.__deferredInstallPrompt = e;
    });
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Fraunces, Plus Jakarta Sans, Hind Siliguri -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Shared Editorial Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Dark Mode Zero-Flash Initializer -->
  <script>
    (function () {
      try {
        const theme = localStorage.getItem('vw_theme');
        if (theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Instant Google Auth & User Session Zero-Flicker Restore -->
  <script>
    (function () {
      try {
        const raw = localStorage.getItem('vw_persistent_user_profile') || localStorage.getItem('vw_user_profile');
        if (raw) {
          window.__vwRestoredUser = JSON.parse(raw);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Shared Sidebar & Mobile Top Navigation -->
  <div id="app-header"></div>

  <!-- Main Content Layout (Adjusts margin based on sidebar state) -->
  <div class="vw-main-layout flex-1 flex flex-col min-w-0">
    <main class="flex-1 w-full max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-9">
      <div id="tools-page-mount" class="vw-panel-reveal"></div>
    </main>

    <!-- Shared Editorial Footer -->
    <div id="app-footer"></div>
  </div>

  <!-- Scripts -->
  <script src="words-data.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderAppHeader('tools');
      renderAppFooter();
      renderToolsPage();
    });

    // Re-render when auth changes or window gains focus
    window.addEventListener('focus', () => {
      if (typeof renderToolsPage === 'function') {
        renderToolsPage();
      }
    });
  </script>
</body>
</html>
