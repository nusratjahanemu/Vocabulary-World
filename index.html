<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocabulary World — বিগিনার থেকে প্রো ইংরেজি শব্দভান্ডার</title>

  <!-- Progressive Web App (PWA) & Mobile Meta Tags -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#2D5A4C" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Vocabulary World" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="VocabWorld" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

  <!-- Early PWA Install Prompt Capture: catches event before other scripts finish loading -->
  <script>
    window.__deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.__deferredInstallPrompt = e;
    });
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Fraunces, Plus Jakarta Sans, Hind Siliguri -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Shared Editorial Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Dark Mode Zero-Flash Initializer -->
  <script>
    (function () {
      try {
        const theme = localStorage.getItem('vw_theme');
        if (theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Shared Sidebar & Mobile Top Navigation -->
  <div id="app-header"></div>

  <!-- Main Content Layout (Adjusts margin based on sidebar state) -->
  <div class="vw-main-layout flex-1 flex flex-col min-w-0">
    <main class="flex-1 w-full max-w-6xl mx-auto px-4 sm:px-6 py-8 sm:py-11">
      
      <!-- Hero Header -->
      <section class="max-w-3xl mx-auto text-center mb-10 sm:mb-12 vw-panel-reveal">
        <span
          class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider border mb-3.5"
          style="background-color: var(--accent-sage-soft); border-color: rgba(45, 90, 76, 0.22); color: var(--accent-sage);"
        >
          VOCABULARY WORLD &bull; ধাপে ধাপে ইংরেজি শব্দভান্ডার
        </span>

        <h1
          class="font-editorial text-3xl sm:text-5xl font-bold tracking-tight leading-tight"
          style="color: var(--ink-primary);"
        >
          Master English Vocabulary, Step by Step.
        </h1>

        <p class="font-bengali text-sm sm:text-base mt-3 leading-relaxed max-w-2xl mx-auto" style="color: var(--ink-secondary);">
          তোমার বর্তমান দক্ষতা অনুযায়ী নিচের যেকোনো একটি Level নির্বাচন করো এবং বাংলা অর্থ, উদাহরণ, সমার্থক-বিপরীতার্থক শব্দ ও সঠিক উচ্চারণসহ ইংরেজি শব্দভান্ডার শেখা শুরু করো।
        </p>
      </section>

      <!-- 4 Proficiency Level Cards Grid -->
      <section aria-label="Proficiency Level Cards" class="vw-panel-reveal">
        <div id="home-level-cards-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5"></div>
      </section>

    </main>

    <!-- Shared Editorial Footer -->
    <div id="app-footer"></div>
  </div>

  <!-- Scripts -->
  <script src="words-data.js"></script>
  <script src="js/common.js"></script>
  <script>
    function selectLevelAndProceed(levelId) {
      if (typeof CURRICULUM_DATA === 'undefined' || !CURRICULUM_DATA[levelId]) return;
      saveSetupToStorage(levelId, null);
      try {
        sessionStorage.setItem('vw_level_chosen', 'true');
      } catch (e) {}
      window.location.href = `learn.html?level=${encodeURIComponent(levelId)}`;
    }

    function renderHomeLevelCards() {
      const grid = document.getElementById('home-level-cards-grid');
      if (!grid || typeof LEVEL_META === 'undefined') return;

      grid.innerHTML = LEVEL_META.map((meta) => {
        return `
          <article
            onclick="selectLevelAndProceed('${meta.id}')"
            class="vw-level-card rounded-3xl p-6 flex flex-col justify-between"
          >
            <div>
              <div class="flex items-center justify-between gap-2 mb-5">
                ${meta.svg}
                <span class="badge-${meta.id} text-[10px] font-bold uppercase tracking-wider px-3 py-1 rounded-full">
                  ${meta.badge} &bull; ${CURRICULUM_DATA[meta.id] ? CURRICULUM_DATA[meta.id].words.length : 0} WORDS
                </span>
              </div>

              <h2 class="font-editorial text-2xl font-bold" style="color: var(--ink-primary);">
                ${meta.title}
              </h2>
              <p class="font-bengali text-xs font-bold mt-0.5 mb-3" style="color: var(--accent-sage);">
                ${meta.bengaliSubtitle}
              </p>

              <p class="font-bengali text-xs sm:text-sm leading-relaxed" style="color: var(--ink-secondary);">
                ${meta.description}
              </p>
            </div>

            <div class="pt-5 mt-5 border-t" style="border-color: var(--border-subtle);">
              <button
                type="button"
                onclick="event.stopPropagation(); selectLevelAndProceed('${meta.id}')"
                class="vw-btn-primary w-full py-3 px-4 rounded-2xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2"
              >
                <span>Explore</span>
                <span>&rarr;</span>
              </button>
            </div>
          </article>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderAppHeader('home');
      renderAppFooter();
      renderHomeLevelCards();
    });
  </script>
</body>
</html>
