<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Botanical Sage Squircle Gradient -->
    <linearGradient id="sageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#346858"/>
      <stop offset="50%" stop-color="#2D5A4C"/>
      <stop offset="100%" stop-color="#1E3E34"/>
    </linearGradient>

    <!-- Warm Ivory Emblem Gradient -->
    <linearGradient id="ivoryGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF8F5"/>
    </linearGradient>

    <!-- Subtle Depth Shadow -->
    <filter id="emblemShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0E211B" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- 1. Rounded Botanical Sage (#2D5A4C) Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#sageGradient)"/>

  <!-- Subtle Inner Border Accent -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#FAF8F5" stroke-opacity="0.12" stroke-width="4"/>

  <!-- 2. Minimal Open-Book / "V" Emblem in Warm Ivory (#FAF8F5) -->
  <g filter="url(#emblemShadow)">
    <!-- Left Page / Wing of the "V" Book -->
    <path d="M 256 384 C 228 352, 154 322, 102 338 C 90 342, 82 332, 86 320 L 126 154 C 130 142, 142 136, 154 138 C 200 148, 238 178, 256 210 Z" fill="url(#ivoryGradient)"/>

    <!-- Right Page / Wing of the "V" Book -->
    <path d="M 256 384 C 284 352, 358 322, 410 338 C 422 342, 430 332, 426 320 L 386 154 C 382 142, 370 136, 358 138 C 312 148, 274 178, 256 210 Z" fill="url(#ivoryGradient)"/>

    <!-- Central Spine "V" Notch -->
    <path d="M 253 210 Q 256 202 259 210 L 259 384 Q 256 389 253 384 Z" fill="#2D5A4C" fill-opacity="0.25"/>

    <!-- Center Knowledge Sprout / Star Accent -->
    <circle cx="256" cy="142" r="14" fill="#FAF8F5"/>
    <path d="M 256 102 L 261 122 L 281 127 L 261 132 L 256 152 L 251 132 L 231 127 L 251 122 Z" fill="#FAF8F5"/>
  </g>
</svg>
