<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A4C"/>
      <stop offset="100%" stop-color="#1B3B31"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D06B"/>
      <stop offset="100%" stop-color="#D4A738"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#ECE5DA"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0E211B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#sageGrad)"/>

  <!-- Subtle Outer Border Accent -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#FAF8F5" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Main Graphic Container with Filter -->
  <g filter="url(#softShadow)" transform="translate(0, 10)">
    <!-- Stylized Open Book Base -->
    <!-- Left Page -->
    <path d="M 120 330 C 170 345, 230 330, 256 310 C 256 190, 256 160, 256 160 C 220 180, 160 170, 120 190 Z" fill="url(#pageGrad)"/>
    <!-- Right Page -->
    <path d="M 392 330 C 342 345, 282 330, 256 310 C 256 190, 256 160, 256 160 C 292 180, 352 170, 392 190 Z" fill="url(#pageGrad)"/>

    <!-- Book Spine Ribbon / Center Accent -->
    <path d="M 252 155 Q 256 150 260 155 L 260 325 Q 256 330 252 325 Z" fill="#2D5A4C"/>

    <!-- Dynamic Learning Sprout / Quill Motif (Warm Gold & Sage) -->
    <!-- Center Stem -->
    <path d="M 256 300 C 256 220, 256 170, 256 120" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>
    
    <!-- Left Sprout Leaf -->
    <path d="M 256 180 C 210 170, 195 130, 225 120 C 250 120, 256 160, 256 180 Z" fill="url(#goldGrad)"/>
    
    <!-- Right Sprout Leaf -->
    <path d="M 256 150 C 300 135, 315 95, 285 85 C 260 85, 256 130, 256 150 Z" fill="#C26D53"/>

    <!-- Central Sparkle / Star of Knowledge -->
    <polygon points="256,60 263,78 281,85 263,92 256,110 249,92 231,85 249,78" fill="url(#goldGrad)"/>

    <!-- Editorial "VW" Wordmark Subtitle Bar -->
    <rect x="180" y="375" width="152" height="34" rx="17" fill="#FAF8F5" fill-opacity="0.95"/>
    <text x="256" y="399" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="900" fill="#2D5A4C" text-anchor="middle" letter-spacing="3">VOCAB</text>
  </g>
</svg>
