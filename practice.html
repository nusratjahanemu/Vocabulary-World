    (function () {
      try {
        const theme = localStorage.getItem('vw_theme');
        if (theme === 'light') {
          document.documentElement.removeAttribute('data-theme');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Instant Google Auth & User Session Zero-Flicker Restore -->
  <script>
    (function () {
      try {
        const raw = localStorage.getItem('vw_persistent_user_profile') || localStorage.getItem('vw_user_profile');
        if (raw) {
          const p = JSON.parse(raw);
          if (p && (p.displayName === 'Google Learner' || p.name === 'Google Learner' || p.email === 'learner@vocabularyworld.com' || (typeof p.email === 'string' && p.email.endsWith('@vocabularyworld.com')))) {
            localStorage.removeItem('vw_persistent_user_profile');
            localStorage.removeItem('vw_user_profile');
          } else {
            window.__vwRestoredUser = p;
          }
        }
      } catch (e) {}
    })();

    // Spaced repetition helpers
    function getTodayDateKey() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function addDaysToDateKey(dateKey, days) {
      const parts = dateKey.split('-');
      const d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      d.setDate(d.getDate() + days);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function getSpacedRepetitionQueue() {
      try {
        const raw = localStorage.getItem('vw_spaced_repetition_queue');
        if (!raw) return SEED_WEAK_WORDS;
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) && parsed.length > 0 ? parsed : SEED_WEAK_WORDS;
      } catch (e) {
        return SEED_WEAK_WORDS;
      }
    }

    function saveSpacedRepetitionQueue(list) {
      try {
        localStorage.setItem('vw_spaced_repetition_queue', JSON.stringify(list || []));
      } catch (e) {}
    }

    function addToSpacedRepetitionQueue(item) {
      if (!item || !item.word) return;
      const list = getSpacedRepetitionQueue();
      const cleanWord = item.word.toLowerCase().trim();
      const existing = list.find(w => w.word.toLowerCase().trim() === cleanWord);

      if (existing) {
        existing.mistakeCount = (existing.mistakeCount || 1) + 1;
        existing.intervalDays = 1;
        existing.dueDate = getTodayDateKey();
      } else {
        list.unshift({
          id: item.id || cleanWord,
          word: item.word,
          pos: item.pos || 'noun',
          meaningBn: item.meaningBn || item.meaning || '',
          definition: item.definition || '',
          example: item.example || '',
          intervalDays: 1,
          repetitionCount: 1,
          dueDate: getTodayDateKey(),
          mistakeCount: 1,
          source: item.source || 'quiz'
        });
      }
      saveSpacedRepetitionQueue(list);
    }

      // Tab 1: Quiz State
      quizIndex: 0,
      quizTimer: 180, // 3 minutes = 180s
      timerInterval: null,
      isQuizActive: false,
      isQuizCompleted: false,
      userAnswers: {},
      selectedOptionIndex: null,
      quizScore: 0,

      // Tab 2: Cloze State
      clozeIndex: 0,
      clozeMode: 'options', // 'options' | 'typing'
      clozeInputText: '',
      clozeFeedback: null, // 'correct' | 'wrong' | null
      clozeStreak: 0,
      showHint: false,

      // Tab 3: Spaced Repetition State
      spacedCardIndex: 0,
      isCardFlipped: false
    };

    function switchPracticeTab(tab) {
      PracticeState.activeTab = tab;
      if (tab === 'quiz' && !PracticeState.isQuizActive && !PracticeState.isQuizCompleted) {
        startQuizSession();
      }
      renderPracticePage();
    }

    // --- TAB 1: QUIZ CONTROLS ---
    function startQuizSession() {
      clearInterval(PracticeState.timerInterval);
      PracticeState.quizIndex = 0;
      PracticeState.quizTimer = 180;
      PracticeState.isQuizActive = true;
      PracticeState.isQuizCompleted = false;
      PracticeState.userAnswers = {};
      PracticeState.selectedOptionIndex = null;
      PracticeState.quizScore = 0;

      PracticeState.timerInterval = setInterval(() => {
        if (PracticeState.quizTimer > 0) {
          PracticeState.quizTimer -= 1;
          updateQuizTimerDisplay();
        } else {
          finishQuizSession();
        }
      }, 1000);
      renderPracticePage();
    }

    function selectQuizOption(optIndex) {
      if (PracticeState.selectedOptionIndex !== null) return; // already answered
      const q = QUIZ_QUESTIONS[PracticeState.quizIndex];
      PracticeState.selectedOptionIndex = optIndex;
      const isCorrect = optIndex === q.correctIndex;
      PracticeState.userAnswers[q.id] = { selected: optIndex, isCorrect };

      if (isCorrect) {
        PracticeState.quizScore += 1;
        if (typeof awardGamePoints === 'function') awardGamePoints(10, true);
        if (typeof showToast === 'function') showToast('✓ সঠিক উত্তর! +10 Points', 'success');
      } else {
        if (typeof awardGamePoints === 'function') awardGamePoints(0, true);
        // Save to Spaced Repetition Weak Words queue!
        addToSpacedRepetitionQueue({
          id: q.id,
          word: q.targetWord,
          pos: q.type === 'preposition' ? 'preposition' : 'word',
          meaningBn: q.meaningBn,
          definition: q.prompt,
          example: q.options[q.correctIndex],
          source: 'quiz_mistake'
        });

      if (PracticeState.quizIndex < QUIZ_QUESTIONS.length - 1) {

        PracticeState.selectedOptionIndex = null;
        renderPracticePage();
      } else {
        finishQuizSession();
      }
    }

      clearInterval(PracticeState.timerInterval);
      PracticeState.isQuizActive = false;
      PracticeState.isQuizCompleted = true;
      renderPracticePage();
    }

    function updateQuizTimerDisplay() {
      const el = document.getElementById('quiz-timer-display');
      if (!el) return;
      const mins = Math.floor(PracticeState.quizTimer / 60);
      const secs = PracticeState.quizTimer % 60;
      el.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      if (PracticeState.quizTimer <= 30) {
        el.classList.add('text-red-600', 'animate-pulse');
      } else {
        el.classList.remove('text-red-600', 'animate-pulse');
      }
    }

    // --- TAB 2: CLOZE CONTROLS ---
    function selectClozeOption(chosenWord) {
      const item = CLOZE_SENTENCES[PracticeState.clozeIndex];
      const isCorrect = chosenWord.toLowerCase().trim() === item.blankWord.toLowerCase().trim();
      PracticeState.clozeFeedback = isCorrect ? 'correct' : 'wrong';

      if (isCorrect) {
        PracticeState.clozeStreak += 1;
        if (typeof awardGamePoints === 'function') awardGamePoints(10, true);
        if (typeof showToast === 'function') showToast('🎉 সঠিক উত্তর! +10 Points', 'success');
      } else {
        PracticeState.clozeStreak = 0;
        addToSpacedRepetitionQueue({
          id: item.id,
          word: item.displayWord,
          meaningBn: item.hintBn,
          definition: item.sentence,
          source: 'cloze_mistake'
        });
        if (typeof showToast === 'function') showToast('✗ ভুল উত্তর &bull; Weak Words তালিকায় যোগ হয়েছে', 'info');
      }
      renderPracticePage();
    }

    function submitClozeTyping() {
      const inputEl = document.getElementById('cloze-type-input');
      if (!inputEl) return;
      const val = inputEl.value.trim();
      if (!val) return;
      selectClozeOption(val);
    }

    function nextClozeSentence() {
      PracticeState.clozeIndex = (PracticeState.clozeIndex + 1) % CLOZE_SENTENCES.length;
      PracticeState.clozeFeedback = null;
      PracticeState.clozeInputText = '';
      PracticeState.showHint = false;
      renderPracticePage();
    }

    // --- TAB 3: SPACED REPETITION CONTROLS ---
    function flipSpacedCard() {
      PracticeState.isCardFlipped = !PracticeState.isCardFlipped;
      renderPracticePage();
    }

    function handleSpacedResponse(responseType) {
      const queue = getSpacedRepetitionQueue();
      const today = getTodayDateKey();
      const current = queue[PracticeState.spacedCardIndex];
      if (!current) return;

      if (responseType === 'again') {
        current.intervalDays = 1;
        current.dueDate = addDaysToDateKey(today, 1);
        current.repetitionCount = (current.repetitionCount || 1) + 1;
        if (typeof showToast === 'function') showToast('⏳ কাল আবার রিভিউ করতে হবে (1d)', 'info');
      } else if (responseType === 'good') {
        current.intervalDays = 3;
        current.dueDate = addDaysToDateKey(today, 3);
        current.repetitionCount = (current.repetitionCount || 1) + 1;
        if (typeof showToast === 'function') showToast('👍 ৩ দিন পর পরবর্তী রিভিউ (3d)', 'success');
      } else if (responseType === 'mastered') {
        current.intervalDays = 7;
        current.dueDate = addDaysToDateKey(today, 7);
        current.repetitionCount = (current.repetitionCount || 1) + 1;
        if (typeof showToast === 'function') showToast('🏆 শব্দ আয়ত্তে এসেছে! ৭ দিন পর ফাইনাল চেক (7d+)', 'success');
      }

      saveSpacedRepetitionQueue(queue);
      PracticeState.isCardFlipped = false;
      PracticeState.spacedCardIndex = (PracticeState.spacedCardIndex + 1);
      renderPracticePage();
    }

      if (dueCards.length === 0 || PracticeState.spacedCardIndex >= dueCards.length) {
        return `
          <section class="vw-editorial-card p-6 sm:p-10 rounded-3xl border text-center space-y-6" style="background-color: var(--surface-white); border-color: var(--border-subtle);">
            <div class="max-w-md mx-auto space-y-4">
              <span class="text-5xl">🎉</span>
              <h2 class="font-editorial text-2xl sm:text-3xl font-bold" style="color: var(--ink-primary);">
                All Reviews Completed for Today!
              </h2>
              <p class="font-bengali text-xs sm:text-sm text-gray-500">
                আজকের দিনের সকল দুর্বল শব্দের স্পেসড রিপিটেশন রিভিশন সফলভাবে সম্পন্ন হয়েছে। নতুন শব্দ অনুশীলন করতে কুইজ দিন!
              </p>

              <div class="p-4 rounded-2xl bg-[#EEF4F1] dark:bg-gray-800 border text-xs" style="border-color: var(--border-subtle);">
                <strong>Total Words in Memory Queue:</strong> ${queue.length} words
              </div>

              <div class="flex items-center justify-center gap-3 pt-2">
                <button
                  type="button"
                  onclick="PracticeState.spacedCardIndex = 0; renderPracticePage();"
                  class="px-5 py-2.5 rounded-xl font-bold text-xs border hover:bg-black/5"
                  style="border-color: var(--border-subtle);"
                >
                  Review Again &bull; পুনরায় রিভিশন
                </button>
                <button
                  type="button"
                  onclick="switchPracticeTab('quiz')"
                  class="px-5 py-2.5 rounded-xl font-bold text-xs text-white"
                  style="background-color: var(--accent-sage);"
                >
                  Take Rapid Quiz &bull; কুইজ শুরু করুন
                </button>
              </div>
            </div>
          </section>
        `;
      }

      const card = dueCards[PracticeState.spacedCardIndex];

      return `
        <section class="vw-editorial-card p-6 sm:p-8 rounded-3xl border space-y-6" style="background-color: var(--surface-white); border-color: var(--border-subtle);">
          
          <!-- Top Sub-Bar: Spaced Counter & SuperMemo Intervals -->
          <div class="flex items-center justify-between pb-4 border-b" style="border-color: var(--border-subtle);">
            <div>
              <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-[#2D5A4C]/10 text-[#2D5A4C] dark:text-[#8CB8A8]">
                SM-2 Spaced Repetition
              </span>
              <div class="text-xs font-bold text-gray-500 mt-1">
                Due Today: Card ${PracticeState.spacedCardIndex + 1} of ${dueCards.length}
              </div>
            </div>

            <div class="flex items-center gap-2">
              <span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-amber-500/10 text-amber-700 dark:text-amber-300 border border-amber-500/20">
                Interval: ${card.intervalDays || 1}d
              </span>
            </div>
          </div>

          <!-- Flashcard Deck Stage -->
          <div class="max-w-xl mx-auto">
            <div
              onclick="flipSpacedCard()"
              class="p-8 sm:p-10 rounded-3xl border bg-gradient-to-br from-[#FAF8F5] to-[#EEF4F1] dark:from-gray-900 dark:to-gray-800 text-center space-y-4 cursor-pointer shadow-md transition-all hover:scale-101"
              style="border-color: var(--border-subtle);"
            >
              <span class="px-2.5 py-0.5 rounded-full text-[10px] uppercase font-bold bg-black/5 dark:bg-white/10 text-gray-500">
                ${card.pos || 'Word'} &bull; Click to Flip
              </span>

              <h3 class="font-editorial text-3xl sm:text-5xl font-bold tracking-tight text-[#2D5A4C] dark:text-[#8CB8A8]">
                ${card.word}
              </h3>

              ${isFlipped ? `
                <div class="space-y-3 pt-3 border-t border-gray-300 dark:border-gray-700 animate-fadeIn">
                  <div class="font-bengali text-lg sm:text-xl font-bold" style="color: var(--ink-primary);">
                    ${card.meaningBn}
                  </div>
                  ${card.definition ? `<p class="text-xs text-gray-600 dark:text-gray-300">${card.definition}</p>` : ''}
                  ${card.example ? `<p class="text-xs text-gray-500 italic">Example: "${card.example}"</p>` : ''}
                </div>
              ` : `
                <div class="pt-4 text-xs font-bold text-gray-400 flex items-center justify-center gap-1.5">
                  <span>👁️</span>
                  <span>Tap to Show Answer &bull; উত্তর দেখুন</span>
                </div>
              `}
            </div>

            <!-- Response Buttons (Again, Good, Mastered) -->
            ${isFlipped ? `
              <div class="grid grid-cols-3 gap-3 pt-6">
                <button
                  type="button"
                  onclick="handleSpacedResponse('again')"
                  class="p-3 rounded-2xl border text-center transition-all bg-rose-500/10 border-rose-500/30 text-rose-800 dark:text-rose-200 hover:bg-rose-500/20 cursor-pointer"
                >
                  <span class="block text-xs font-bold">Again</span>
                  <span class="block text-[10px] opacity-75">1 Day (কাল)</span>
                </button>
                <button
                  type="button"
                  onclick="handleSpacedResponse('good')"
                  class="p-3 rounded-2xl border text-center transition-all bg-amber-500/10 border-amber-500/30 text-amber-800 dark:text-amber-200 hover:bg-amber-500/20 cursor-pointer"
                >
                  <span class="block text-xs font-bold">Good</span>
                  <span class="block text-[10px] opacity-75">3 Days (৩ দিন)</span>
                </button>
                <button
                  type="button"
                  onclick="handleSpacedResponse('mastered')"
                  class="p-3 rounded-2xl border text-center transition-all bg-emerald-500/10 border-emerald-500/30 text-emerald-800 dark:text-emerald-200 hover:bg-emerald-500/20 cursor-pointer"
                >
                  <span class="block text-xs font-bold">Mastered</span>
                  <span class="block text-[10px] opacity-75">7 Days+ (৭ দিন+)</span>
                </button>
              </div>
            ` : ''}
          </div>

        </section>
      `;
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof renderAppHeader === 'function') renderAppHeader('practice');
      if (typeof renderAppFooter === 'function') renderAppFooter();
      startQuizSession();
    });
  </script>
</body>
</html>
