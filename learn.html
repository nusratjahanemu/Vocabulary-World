<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learn Vocabulary & Curriculum — Vocabulary World</title>

  <!-- Progressive Web App (PWA) & Mobile Meta Tags -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#2D5A4C" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Vocabulary World" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="VocabWorld" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />

  <!-- Early PWA Install Prompt Capture: catches event before other scripts finish loading -->
  <script>
    window.__deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.__deferredInstallPrompt = e;
    });
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Fraunces, Plus Jakarta Sans, Hind Siliguri -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Shared Editorial Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Dark Mode Zero-Flash Initializer -->
  <script>
    (function () {
      try {
        const theme = localStorage.getItem('vw_theme');
        if (theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Shared Sidebar & Mobile Top Navigation -->
  <div id="app-header"></div>

  <!-- Main Content Layout (Adjusts margin based on sidebar state) -->
  <div class="vw-main-layout flex-1 flex flex-col min-w-0">
    <main class="flex-1 w-full max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-9">
      <div id="learn-page-mount" class="vw-panel-reveal"></div>
    </main>

    <!-- Shared Editorial Footer -->
    <div id="app-footer"></div>
  </div>

  <!-- Scripts -->
  <script src="words-data.js"></script>
  <script src="js/common.js"></script>
  <script>
    let activeTab = 'all'; // 'all' | 'vocab' | 'my-vocab' | 'curriculum' | 'stories' | 'newspaper' | 'derivatives'
    let derivativesActiveListIdx = 0;
    let derivativesSearchQuery = '';
    const openRelations = {}; // { [wordId]: { type, word, meaningBn, explanationBn } }

    // Support query param ?level=xxx and ?tab=xxx
    const urlParams = new URLSearchParams(window.location.search);
    const paramLevel = urlParams.get('level');
    if (paramLevel && typeof CURRICULUM_DATA !== 'undefined' && CURRICULUM_DATA[paramLevel]) {
      AppState.selectedLevel = paramLevel;
      saveSetupToStorage(paramLevel, AppState.assessmentIndex);
    }
    const paramTab = urlParams.get('tab');
    if (paramTab) {
      activeTab = paramTab;
    }

    function setDerivativesListIdx(idx) {
      derivativesActiveListIdx = idx;
      derivativesSearchQuery = '';
      renderLearnPage();
    }

    function setDerivativesSearch(val) {
      derivativesSearchQuery = val;
      renderLearnPage();
    }

    function clearDerivativesSearch() {
      derivativesSearchQuery = '';
      renderLearnPage();
    }

    function switchLevel(newLevel) {
      if (!CURRICULUM_DATA[newLevel]) return;
      PronunciationEngine.stopAll();
      AppState.selectedLevel = newLevel;
      saveSetupToStorage(newLevel, AppState.assessmentIndex);
      renderAppHeader('learn');
      const mount = document.getElementById('learn-page-mount');
      if (mount) {
        mount.className = 'vw-view-enter';
      }
      renderLearnPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateLevelProgressBar() {
      const lvl = CURRICULUM_DATA[AppState.selectedLevel || 'beginner'];
      if (!lvl) return;
      const exploredLevelCount = lvl.words.filter((w) => AppState.tracker.exploredWordIds.includes(w.id)).length;
      const levelProgressPct = Math.round((exploredLevelCount / lvl.words.length) * 100);
      const bar = document.getElementById('level-progress-bar');
      const countEl = document.getElementById('level-progress-count');
      if (bar) bar.style.width = `${levelProgressPct}%`;
      if (countEl) countEl.textContent = `${exploredLevelCount}/${lvl.words.length}`;
    }

    function setFilterTab(tabId) {
      PronunciationEngine.stopAll();
      activeTab = tabId;
      const mount = document.getElementById('learn-page-mount');
      if (mount) {
        mount.classList.remove('vw-view-enter');
        void mount.offsetWidth;
        mount.classList.add('vw-view-enter');
      }
      renderLearnPage();
    }

    function toggleWordRelation(wordId, relType, index) {
      const lvl = CURRICULUM_DATA[AppState.selectedLevel];
      if (!lvl) return;
      const wordObj = lvl.words.find((w) => w.id === wordId);
      if (!wordObj) return;

      const list = relType === 'synonym' ? (wordObj.synonyms || []) : (wordObj.antonyms || []);
      const item = list && list[index];
      if (!item) return;

      const relWord = typeof item === 'string' ? item : (item.word || '');
      const relMeaning = typeof item === 'string' ? item : (item.meaningBn || relWord);
      const relExp = typeof item === 'string' ? `"${relWord}" শব্দটি "${wordObj.word}" এর ${relType === 'synonym' ? 'সমার্থক' : 'বিপরীত'} শব্দ।` : (item.explanationBn || '');

      trackWordExplored(wordId);

      const current = openRelations[wordId];
      if (current && current.type === relType && current.word === relWord) {
        delete openRelations[wordId];
      } else {
        openRelations[wordId] = {
          type: relType,
          word: relWord,
          meaningBn: relMeaning,
          explanationBn: relExp
        };
      }

      renderLearnPage();
    }

    function buildVocabularyCardHTML(item) {
      const wordSpeakId = registerSpeakText(item.word);
      const exSpeakId = registerSpeakText(item.example);
      const activeRel = openRelations[item.id];

      const rawSyns = Array.isArray(item.synonyms) ? item.synonyms : [];
      const synPills = rawSyns.length > 0
        ? rawSyns
            .map((syn, idx) => {
              const synWord = typeof syn === 'string' ? syn : (syn && syn.word) ? syn.word : '';
              if (!synWord) return '';
              const synSpeakId = registerSpeakText(synWord);
              const isActive = activeRel && activeRel.type === 'synonym' && activeRel.word === synWord;
              return `
                <div class="vw-pill-syn ${isActive ? 'active' : ''} inline-flex items-center rounded-full overflow-hidden">
                  <button
                    type="button"
                    onclick="toggleWordRelation('${item.id}', 'synonym', ${idx})"
                    class="px-3 py-1.5 text-xs font-semibold focus:outline-none"
                  >
                    ${escapeHtml(synWord)}
                  </button>
                  <button
                    type="button"
                    onclick="event.stopPropagation(); trackWordExplored('${item.id}'); speakById(${synSpeakId}, this)"
                    aria-label="Pronounce ${escapeHtml(synWord)}"
                    class="vw-speak-btn pr-2.5 pl-1 py-1.5 opacity-85 hover:opacity-100"
                  >
                    ${speakerIconSvg('w-3 h-3')}
                  </button>
                </div>
              `;
            })
            .join('')
        : '<span class="text-xs text-gray-400">কোনো সমার্থক শব্দ যোগ করা হয়নি</span>';

      const rawAnts = Array.isArray(item.antonyms) ? item.antonyms : [];
      const antPills = rawAnts.length > 0
        ? rawAnts
            .map((ant, idx) => {
              const antWord = typeof ant === 'string' ? ant : (ant && ant.word) ? ant.word : '';
              if (!antWord) return '';
              const antSpeakId = registerSpeakText(antWord);
              const isActive = activeRel && activeRel.type === 'antonym' && activeRel.word === antWord;
              return `
                <div class="vw-pill-ant ${isActive ? 'active' : ''} inline-flex items-center rounded-full overflow-hidden">
                  <button
                    type="button"
                    onclick="toggleWordRelation('${item.id}', 'antonym', ${idx})"
                    class="px-3 py-1.5 text-xs font-semibold focus:outline-none"
                  >
                    ${escapeHtml(antWord)}
                  </button>
                  <button
                    type="button"
                    onclick="event.stopPropagation(); trackWordExplored('${item.id}'); speakById(${antSpeakId}, this)"
                    aria-label="Pronounce ${escapeHtml(antWord)}"
                    class="vw-speak-btn pr-2.5 pl-1 py-1.5 opacity-85 hover:opacity-100"
                  >
                    ${speakerIconSvg('w-3 h-3')}
                  </button>
                </div>
              `;
            })
            .join('')
        : '<span class="text-xs text-gray-400">কোনো বিপরীত শব্দ যোগ করা হয়নি</span>';

      const inlineExplanationBox = activeRel
        ? `
          <div
            class="vw-meaning-reveal mt-3 rounded-2xl p-4 border shadow-xs"
            style="
              background-color: ${activeRel.type === 'synonym' ? 'var(--accent-sage-soft)' : 'var(--accent-terracotta-soft)'};
              border-color: ${activeRel.type === 'synonym' ? 'rgba(45, 90, 76, 0.25)' : 'rgba(194, 109, 83, 0.28)'};
            "
          >
            <div class="flex items-center justify-between gap-2 mb-1">
              <span
                class="font-bengali text-[11px] font-bold uppercase tracking-wider"
                style="color: ${activeRel.type === 'synonym' ? 'var(--accent-sage)' : 'var(--accent-terracotta)'};"
              >
                বাংলা অর্থ ও ব্যাখ্যা &bull; ${activeRel.type === 'synonym' ? 'Synonym (সমার্থক)' : 'Antonym (বিপরীতার্থক)'}
              </span>
              <span class="font-editorial text-sm font-bold" style="color: var(--ink-primary);">
                ${escapeHtml(activeRel.word)}
              </span>
            </div>
            <p class="font-bengali text-sm font-bold" style="color: var(--ink-primary);">
              অর্থ: ${escapeHtml(activeRel.meaningBn)}
            </p>
            <p class="font-bengali text-xs mt-1 leading-relaxed" style="color: var(--ink-secondary);">
              ${escapeHtml(activeRel.explanationBn)}
            </p>
          </div>
        `
        : '';

      return `
        <article class="vw-word-card rounded-3xl p-5 sm:p-7">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <!-- Left Column: Word with Automatic Image Frame, Bengali Meaning & Example -->
            <div class="lg:col-span-6 space-y-3.5">
              
              <!-- Word Header Row paired with Picture Frame -->
              <div class="flex items-start gap-3.5 sm:gap-4">
                <!-- 88x88px (96x96px desktop) Picture Frame with Loading Skeleton -->
                <div
                  id="word-img-frame-${item.id}"
                  class="vw-word-img-frame"
                >
                  <div class="animate-pulse w-full h-full flex flex-col items-center justify-center p-2 text-center" style="background-color: var(--surface-sand);">
                    <svg class="w-6 h-6 opacity-40 mb-1" style="color: var(--accent-sage);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    <span class="text-[9px] font-mono tracking-wider opacity-60 uppercase" style="color: var(--ink-muted);">Photo</span>
                  </div>
                </div>

                <!-- Word Title, Badges & Bengali Meaning -->
                <div class="flex-1 min-w-0 space-y-2">
                  <div class="flex flex-wrap items-center justify-between gap-1.5">
                    <div class="flex items-center gap-2">
                      <h3 class="font-editorial text-2xl sm:text-3xl font-bold" style="color: var(--ink-primary);">
                        ${escapeHtml(item.word)}
                      </h3>
                      <button
                        type="button"
                        onclick="trackWordExplored('${item.id}'); speakById(${wordSpeakId}, this)"
                        class="vw-speak-btn vw-speak-main px-2.5 py-1 rounded-full text-xs font-bold gap-1 shrink-0"
                      >
                        ${speakerIconSvg('w-3.5 h-3.5')}
                        <span class="hidden sm:inline">Listen</span>
                      </button>
                      ${renderCardAccentSwitcherHTML(wordSpeakId, item.id)}
                      ${typeof renderMyVocabCardButtonHTML === 'function' ? renderMyVocabCardButtonHTML(item.id) : ''}
                      <button
                        type="button"
                        onclick="askAITutorAboutWord('${escapeHtml(item.word)}')"
                        class="vw-card-ask-tutor-btn"
                        title="Ask Vocab AI Tutor about ${escapeHtml(item.word)}"
                        aria-label="Ask Vocab AI Tutor about ${escapeHtml(item.word)}"
                      >
                        <span class="text-amber-500 text-xs">✨</span>
                        <span class="font-bengali text-xs font-bold">Ask Tutor</span>
                      </button>
                    </div>

                    <div class="flex items-center gap-1.5 shrink-0">
                      ${item.isCustom ? `<span class="vw-custom-word-pill text-[10px] font-bold px-2.5 py-0.5 rounded-full">+ Custom Word</span>` : ''}
                      <span class="text-xs font-mono" style="color: var(--ink-muted);">${escapeHtml(item.ipa || '')}</span>
                      <span class="text-[10px] font-bold px-2 py-0.5 rounded-full" style="background-color: var(--surface-sand); color: var(--ink-secondary);">
                        ${escapeHtml(item.pos || 'Word')}
                      </span>
                    </div>
                  </div>

                  <!-- Bengali Meaning -->
                  <div class="rounded-2xl px-3.5 py-2 border" style="background-color: var(--accent-sage-soft); border-color: rgba(45, 90, 76, 0.2);">
                    <span class="font-bengali text-[10px] font-bold uppercase tracking-wider block" style="color: var(--accent-sage);">
                      বাংলা অর্থ (Bengali Meaning)
                    </span>
                    <p class="font-bengali text-sm sm:text-base font-bold mt-0.5 leading-snug" style="color: var(--ink-primary);">
                      ${escapeHtml(item.meaningBn)}
                    </p>
                  </div>
                </div>
              </div>

              <p class="text-xs sm:text-sm leading-relaxed" style="color: var(--ink-secondary);">
                ${escapeHtml(item.explanationEn)}
              </p>

              <!-- Example Sentence with Speaker + Bengali Translation -->
              <div class="rounded-2xl p-4 border space-y-1.5" style="background-color: var(--bg-ivory); border-color: var(--border-subtle);">
                <div class="flex items-center justify-between gap-2">
                  <span class="text-[10px] font-bold uppercase tracking-wider" style="color: var(--ink-muted);">
                    EXAMPLE SENTENCE
                  </span>
                  <button
                    type="button"
                    onclick="trackWordExplored('${item.id}'); speakById(${exSpeakId}, this)"
                    class="vw-speak-btn vw-speak-main px-2.5 py-1 rounded-full text-xs font-bold gap-1"
                  >
                    ${speakerIconSvg('w-3 h-3')}
                    <span>Listen</span>
                  </button>
                </div>
                <p class="text-xs sm:text-sm font-medium leading-relaxed" style="color: var(--ink-primary);">
                  &ldquo;${escapeHtml(item.example)}&rdquo;
                </p>
                <p class="font-bengali text-xs leading-relaxed" style="color: var(--ink-secondary);">
                  (${escapeHtml(item.exampleBn)})
                </p>
              </div>
            </div>

            <!-- Right Column: 5 Synonyms + 5 Antonyms + Inline Bengali Meaning & Explanation -->
            <div class="lg:col-span-6 lg:border-l lg:pl-6 space-y-4" style="border-color: var(--border-subtle);">
              <div>
                <div class="flex items-center justify-between gap-2 mb-2">
                  <span class="font-bengali text-xs font-bold" style="color: var(--accent-sage);">
                    Synonyms (সমার্থক শব্দ — ৫টি)
                  </span>
                  <span class="font-bengali text-[11px]" style="color: var(--ink-muted);">
                    শব্দে ক্লিক করলে বাংলা ব্যাখ্যা খুলবে
                  </span>
                </div>
                <div class="flex flex-wrap gap-2">
                  ${synPills}
                </div>
              </div>

              <div>
                <div class="flex items-center justify-between gap-2 mb-2">
                  <span class="font-bengali text-xs font-bold" style="color: var(--accent-terracotta);">
                    Antonyms (বিপরীতার্থক শব্দ — ৫টি)
                  </span>
                </div>
                <div class="flex flex-wrap gap-2">
                  ${antPills}
                </div>
              </div>

              ${inlineExplanationBox}
            </div>
          </div>

          <!-- Full-Width AI Cartoon Conversation Video Row (Spans 100% width across both columns) -->
          <div class="vw-card-video-row mt-6 pt-5" style="border-top: 1px solid #E5DFD3; width: 100%;">
            ${renderCartoonThumbnailCardHTML(item)}
          </div>

          <!-- DERIVATIVES (Word Family) Section Full Width at Bottom -->
          ${buildDerivativesBlockHTML(item)}
        </article>
      `;
    }

    function highlightWordInSentence(sentence, targetWord) {
      if (!sentence || !targetWord) return escapeHtml(sentence || '');
      const cleanWord = String(targetWord).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const escapedSentence = escapeHtml(sentence);
      const regex = new RegExp(`\\b(${cleanWord})\\b`, 'gi');
      return escapedSentence.replace(regex, `<strong class="vw-derivative-highlight-word font-bold">$1</strong>`);
    }

    function buildDerivativesBlockHTML(item) {
      const d = item.derivatives;
      if (!d || typeof d !== 'object' || (!d.noun && !d.verb && !d.adjective && !d.adverb)) {
        return '';
      }

      const forms = [
        { key: 'noun', label: 'Noun (বিশেষ্য)', form: d.noun },
        { key: 'verb', label: 'Verb (ক্রিয়া)', form: d.verb },
        { key: 'adjective', label: 'Adjective (বিশেষণ)', form: d.adjective },
        { key: 'adverb', label: 'Adverb (ক্রিয়া বিশেষণ)', form: d.adverb }
      ];

      const tableRowsHTML = `
        <div class="vw-derivatives-table-wrap rounded-2xl border overflow-hidden mt-3" style="border-color: var(--border-subtle); background-color: var(--surface-white);">
          <table class="vw-derivatives-table">
            <thead>
              <tr>
                <th style="width: 25%;">Noun (বিশেষ্য)</th>
                <th style="width: 25%;">Verb (ক্রিয়া)</th>
                <th style="width: 25%;">Adjective (বিশেষণ)</th>
                <th style="width: 25%;">Adverb (ক্রিয়া বিশেষণ)</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                ${forms.map(f => {
                  if (f.form && f.form.word) {
                    return `
                      <td>
                        <div class="vw-derivative-cell-word">${escapeHtml(f.form.word)}</div>
                        <div class="vw-derivative-cell-pron">${escapeHtml(f.form.banglaPronunciation || '')}</div>
                      </td>
                    `;
                  }
                  return `<td><span class="vw-derivative-cell-empty">—</span></td>`;
                }).join('')}
              </tr>
            </tbody>
          </table>
        </div>
      `;

      const breakdownHTML = forms
        .filter(f => f.form && f.form.word)
        .map(f => {
          const form = f.form;
          return `
            <div class="vw-derivative-entry space-y-1.5">
              <!-- Line 1: Word + Pronunciation + (pos) + — Meaning + Audio -->
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
                  <span class="font-editorial text-base sm:text-lg font-bold" style="color: var(--ink-primary);">
                    ${escapeHtml(form.word)}
                  </span>
                  <span class="font-mono text-xs text-gray-500">
                    ${escapeHtml(form.banglaPronunciation || '')}
                  </span>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase" style="background-color: var(--accent-sage-soft); color: var(--accent-sage);">
                    (${escapeHtml(form.pos || f.key)})
                  </span>
                  <span class="font-bengali text-xs sm:text-sm font-semibold" style="color: var(--ink-secondary);">
                    — ${escapeHtml(form.banglaMeaning || '')}
                  </span>
                </div>
                <button
                  type="button"
                  onclick="event.stopPropagation(); speakDerivative('${escapeHtml(form.word).replace(/'/g, "\\'")}', this)"
                  class="vw-speak-btn p-1.5 rounded-full text-xs hover:scale-110 transition-transform cursor-pointer"
                  title="Pronounce ${escapeHtml(form.word)}"
                  aria-label="Pronounce ${escapeHtml(form.word)}"
                >
                  ${speakerIconSvg('w-3.5 h-3.5')}
                </button>
              </div>

              <!-- Line 2: English Example with Target Word Bolded in Sage -->
              <div class="text-xs sm:text-sm font-medium leading-relaxed" style="color: var(--ink-primary);">
                <span class="font-mono font-bold mr-1" style="color: var(--accent-sage);">=</span>
                ${highlightWordInSentence(form.exampleEn, form.word)}
              </div>

              <!-- Line 3: Bangla Translation of Example -->
              <div class="font-bengali text-xs leading-relaxed" style="color: var(--ink-muted);">
                <span class="font-bold mr-1" style="color: var(--ink-secondary);">অর্থ:</span>
                ${escapeHtml(form.exampleBn || '')}
              </div>
            </div>
          `;
        })
        .join('');

      return `
        <div class="mt-6 pt-5 border-t border-[var(--border-subtle)] space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <span class="w-6 h-6 rounded-lg flex items-center justify-center font-bold text-xs" style="background-color: var(--accent-sage-soft); color: var(--accent-sage);">
                🔀
              </span>
              <div>
                <h4 class="font-editorial text-sm sm:text-base font-bold uppercase tracking-wider" style="color: var(--accent-sage);">
                  DERIVATIVES (পদ রূপান্তর — Word Family)
                </h4>
                <p class="font-bengali text-[11px]" style="color: var(--ink-muted);">

    function buildDerivativesTabHTML(lvl) {
      const allWords = (lvl.words || []).filter(w => w.derivatives && typeof w.derivatives === 'object');
      const listSize = 10;
      const totalLists = Math.ceil(allWords.length / listSize);

      let displayedWords = [];
      let isSearching = false;
      const q = (derivativesSearchQuery || '').trim().toLowerCase();

      if (q) {
        isSearching = true;
        displayedWords = allWords.filter(w => {
          if (w.word && w.word.toLowerCase().includes(q)) return true;
          if (w.meaningBn && w.meaningBn.toLowerCase().includes(q)) return true;
          const d = w.derivatives;
          if (d) {
            for (const posKey of ['noun', 'verb', 'adjective', 'adverb']) {
              if (d[posKey] && d[posKey].word && d[posKey].word.toLowerCase().includes(q)) return true;
              if (d[posKey] && d[posKey].banglaMeaning && d[posKey].banglaMeaning.toLowerCase().includes(q)) return true;
            }
          }
          return false;
        });
      } else {
        const start = derivativesActiveListIdx * listSize;
        const end = start + listSize;
        displayedWords = allWords.slice(start, end);
      }

      // Word list selector pills
      const listPillsHTML = Array.from({ length: totalLists }).map((_, idx) => {
        const start = idx * listSize + 1;
        const end = Math.min((idx + 1) * listSize, allWords.length);
        const isActive = !isSearching && derivativesActiveListIdx === idx;
        const label = `Word list-${String(idx + 1).padStart(2, '0')}`;
        return `
          <button
            type="button"
            onclick="setDerivativesListIdx(${idx})"
            class="vw-deriv-list-pill ${isActive ? 'is-active' : ''}"
          >
            <span>${label}</span>
            <span class="opacity-75 text-[10px] ml-1">(${start}-${end})</span>
          </button>
        `;
      }).join('');

      // Cards list
      const cardsHTML = displayedWords.length > 0
        ? displayedWords.map((item, idx) => {
            const listOffset = isSearching ? idx + 1 : (derivativesActiveListIdx * listSize + idx + 1);
            return `
              <div class="rounded-3xl p-5 sm:p-7 border space-y-4" style="background-color: var(--surface-white); border-color: var(--border-subtle);">

                    <span class="w-8 h-8 rounded-full flex items-center justify-center font-mono font-bold text-xs" style="background-color: var(--accent-sage-soft); color: var(--accent-sage);">
                      #${listOffset}
                    </span>
                    <div>
                      <div class="flex items-center gap-2">
                        <h3 class="font-editorial text-2xl sm:text-3xl font-bold" style="color: var(--ink-primary);">
                          ${escapeHtml(item.word)}
                        </h3>
                        <button
                          type="button"
                          onclick="speakDerivative('${escapeHtml(item.word).replace(/'/g, "\\'")}', this)"
                          class="vw-speak-btn p-1.5 rounded-full text-xs hover:scale-110 transition-transform cursor-pointer"
                          title="Pronounce ${escapeHtml(item.word)}"
                        >
                          ${speakerIconSvg('w-3.5 h-3.5')}
                        </button>
                      </div>
                      <p class="font-bengali text-xs sm:text-sm font-semibold mt-0.5" style="color: var(--ink-secondary);">
                        মূল অর্থ: ${escapeHtml(item.meaningBn || '')}

                    ${escapeHtml(item.pos || 'Word')} &bull; ${escapeHtml(lvl.title)}

                </div>

                <!-- Derivatives Block -->
                ${buildDerivativesBlockHTML(item)}
              </div>
            `;
          }).join('')

            <div class="text-3xl">🔍</div>

            </h4>

              অনুগ্রহ করে অন্য কোনো ইংরেজি শব্দ বা বাংলা অর্থ দিয়ে খুঁজুন অথবা সার্চ ক্লিয়ার করুন।

    function escapeRegex(string) {
      return (string || '').replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');
    }

    function highlightKeyword(sentence, keyWord) {
      if (!keyWord || !sentence) return escapeHtml(sentence || '');
      const escaped = escapeHtml(sentence);
      const safeKey = (keyWord || '').replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');
      const regex = new RegExp('(' + safeKey + ')', 'gi');
      return escaped.replace(regex, '<span class="font-bold underline decoration-2 decoration-[#2D5A4C] text-[#2D5A4C]">$1</span>');
    }

                <span class="w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs" style="background-color: var(--accent-sage-soft); color: var(--accent-sage);">
                  📰
                </span>
                <span class="text-[11px] font-bold uppercase tracking-wider" style="color: var(--accent-sage);">
                  AUTHENTIC JOURNALISTIC ENGLISH &bull; সংবাদপত্রের ভাষা ও সম্পাদকীয় বাক্য
                </span>
              </div>
              <h3 class="font-editorial text-xl sm:text-2xl font-bold" style="color: var(--ink-primary);">
                ${nh.en} <span class="font-bengali text-sm font-semibold" style="color: var(--accent-sage);">${nh.bn}</span>
              </h3>
              <p class="font-bengali text-xs" style="color: var(--ink-secondary);">
                ${nh.desc}
              </p>
            </div>
            <div class="shrink-0 flex items-center gap-2">
              <span class="text-[11px] font-bold px-3 py-1 rounded-full border shadow-2xs" style="background-color: var(--surface-sand); border-color: var(--border-subtle); color: var(--ink-secondary);">
                ${lvl.newspaperSentences.length}টি বাস্তব পত্রিকার বাক্য
              </span>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            ${lvl.newspaperSentences
              .map((item) => {
                const sid = registerSpeakText(item.sentence);
                return `
                  <div class="rounded-2xl p-5 border space-y-3.5 flex flex-col justify-between transition-all hover:border-[#2D5A4C] hover:shadow-sm" style="background-color: var(--bg-ivory); border-color: var(--border-subtle);">
                    <div>
                      <!-- Source Banner & Category Tag -->
                      <div class="flex items-center justify-between gap-2 mb-2.5 flex-wrap">
                        <div class="flex items-center gap-2">
                          <span class="text-xs font-bold px-2.5 py-1 rounded-full border shadow-2xs font-editorial flex items-center gap-1.5" style="background-color: var(--surface-white); border-color: var(--border-subtle); color: var(--accent-sage);">
                            <span>🗞️</span>
                            <span>${escapeHtml(item.source)}</span>
                          </span>
                          <span class="text-[10px] font-bold px-2 py-0.5 rounded-md uppercase tracking-wider" style="background-color: var(--accent-sage-soft); color: var(--accent-sage);">
                            ${escapeHtml(item.category)}
                          </span>
                        </div>
                        <button
                          type="button"
                          onclick="speakById(${sid}, this)"
                          class="vw-speak-btn vw-speak-main px-2.5 py-1 rounded-full text-xs font-bold gap-1 shrink-0 cursor-pointer"
                          title="Listen to native pronunciation"
                        >
                          ${speakerIconSvg('w-3 h-3')}
                          <span>Listen</span>
                        </button>
                      </div>

                      <!-- Headline Context -->
                      <div class="text-[11px] font-semibold italic mb-2 line-clamp-1" style="color: var(--ink-muted);">
                        &bull; Context: &ldquo;${escapeHtml(item.headline)}&rdquo;
                      </div>

                      <!-- The Journalistic Sentence -->
                      <div class="rounded-xl p-3.5 border relative" style="background-color: var(--surface-white); border-color: var(--border-subtle);">
                        <p class="font-editorial text-sm sm:text-base font-semibold leading-relaxed" style="color: var(--ink-primary);">
                          &ldquo;${highlightKeyword(item.sentence, item.keyWord)}&rdquo;
                        </p>
                      </div>

                      <!-- Bengali Translation -->
                      <div class="mt-2.5 px-3 py-2 rounded-xl border text-xs leading-relaxed font-bengali" style="background-color: var(--surface-sand); border-color: var(--border-subtle); color: var(--ink-secondary);">
                        <span class="font-bold text-[10px] uppercase block mb-0.5" style="color: var(--accent-terracotta);">বাংলা অনুবাদ:</span>
                        ${escapeHtml(item.sentenceBn)}
                      </div>
                    </div>

                    <!-- Vocabulary & Journalistic Usage Note -->
                    <div class="pt-2 border-t flex flex-col gap-1 text-[11px]" style="border-color: var(--border-subtle);">
                      <div class="flex items-center gap-1.5 flex-wrap">
                        <span class="font-bold" style="color: var(--accent-sage);">🎯 Key Word:</span>
                        <strong class="font-editorial font-bold px-1.5 py-0.2 rounded" style="background-color: var(--accent-sage-soft); color: var(--accent-sage);">${escapeHtml(item.keyWord)}</strong>
                        <span class="font-bengali" style="color: var(--ink-muted);">(${escapeHtml(item.keyWordMeaningBn)})</span>
                      </div>
                      <p class="font-bengali text-[11px] leading-relaxed" style="color: var(--ink-muted);">
                        <strong style="color: var(--ink-secondary);">ব্যবহার নোট:</strong> ${escapeHtml(item.editorialNote)}
                      </p>
                    </div>
                  </div>
                `;
              })
              .join('')}
          </div>
        </div>
      `;
    }

    function buildCompactTrackerHTML() {
      const t = AppState.tracker;
      return `
        <div class="rounded-3xl p-5 sm:p-7 border space-y-4" style="background-color: var(--surface-white); border-color: var(--border-subtle);">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div>
              <span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full inline-block mb-1" style="background-color: var(--accent-sage-soft); color: var(--accent-sage);">
                DAILY STUDY ACTIVITY &bull; আজকের অগ্রগতি
              </span>
              <h3 class="font-editorial text-xl font-bold" style="color: var(--ink-primary);">
                Today&rsquo;s Learning Progress
              </h3>
            </div>
            <a
              href="tracker.html"
              class="font-bengali text-xs font-bold hover:underline"
              style="color: var(--accent-sage);"
            >
              বিস্তারিত ড্যাশবোর্ড দেখুন (View Full Tracker) &rarr;
            </a>
          </div>

          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3.5">
            <div class="rounded-2xl p-4 border" style="background-color: var(--bg-ivory); border-color: var(--border-subtle);">
              <span class="text-xs font-semibold block" style="color: var(--ink-secondary);">Words Explored</span>
              <span class="font-bengali text-[11px] block" style="color: var(--ink-muted);">শব্দ অনুশীলন</span>
              <strong id="tracker-words-explored" class="font-editorial text-2xl font-bold block mt-1" style="color: var(--accent-sage);">
                ${t.exploredWordIds.length}
              </strong>
            </div>

            <div class="rounded-2xl p-4 border" style="background-color: var(--bg-ivory); border-color: var(--border-subtle);">
              <span class="text-xs font-semibold block" style="color: var(--ink-secondary);">Flashcards Done</span>
              <span class="font-bengali text-[11px] block" style="color: var(--ink-muted);">সম্পন্ন ফ্ল্যাশকার্ড</span>
              <strong id="tracker-flashcards-done" class="font-editorial text-2xl font-bold block mt-1" style="color: var(--ink-primary);">
                ${t.flashcardsCompleted}
              </strong>
            </div>

            <div class="rounded-2xl p-4 border" style="background-color: var(--bg-ivory); border-color: var(--border-subtle);">
              <span class="text-xs font-semibold block" style="color: var(--ink-secondary);">Game Score</span>
              <span class="font-bengali text-[11px] block" style="color: var(--ink-muted);">গেম স্কোর</span>
              <strong id="tracker-game-score" class="font-editorial text-2xl font-bold block mt-1" style="color: var(--accent-terracotta);">
                ${t.gameScore}
              </strong>
            </div>

            <div class="rounded-2xl p-4 border" style="background-color: var(--bg-ivory); border-color: var(--border-subtle);">
              <span class="text-xs font-semibold block" style="color: var(--ink-secondary);">Quiz Answered</span>
              <span class="font-bengali text-[11px] block" style="color: var(--ink-muted);">কুইজ উত্তর</span>
              <strong id="tracker-quiz-answered" class="font-editorial text-2xl font-bold block mt-1" style="color: var(--accent-sage);">
                ${t.quizAnswered}
              </strong>
            </div>
          </div>
        </div>
      `;
    }

    function renderLearnPage() {
      if (typeof syncCustomWordsIntoCurriculum === 'function') {
        syncCustomWordsIntoCurriculum();
      }
      const mount = document.getElementById('learn-page-mount');
      const levelId = AppState.selectedLevel || 'beginner';
      const lvl = CURRICULUM_DATA[levelId];
      const meta = LEVEL_META.find((m) => m.id === levelId);
      const assessOpt = typeof ASSESSMENT_OPTIONS !== 'undefined' ? ASSESSMENT_OPTIONS.find((o) => o.id === AppState.assessmentIndex) : null;
      if (!mount || !lvl || !meta) return;

      const myVocabCount = typeof getMyVocabList === 'function' ? getMyVocabList().length : 0;
      const tabItems = [
        { id: 'all', label: 'All Sections (সবগুলো)' },
        { id: 'vocab', label: `Vocabulary Cards (${lvl.words.length}টি শব্দ)` },
        { id: 'derivatives', label: `Derivatives (পদ রূপান্তর — ${lvl.words.length}টি শব্দ)` },
        { id: 'my-vocab', label: `My Vocab List (${myVocabCount}টি সেভ করা শব্দ)` },
        { id: 'curriculum', label: 'Curriculum (পাঠ্যক্রম)' },
        { id: 'stories', label: `Big Stories (${lvl.stories ? lvl.stories.length : 0}টি বড় গল্প)` }
      ];

      if (lvl.id !== 'beginner' && lvl.newspaperSentences && lvl.newspaperSentences.length) {
        tabItems.push({
          id: 'newspaper',
          label: `Newspaper Sentences (${lvl.newspaperSentences.length}টি পত্রিকার বাক্য)`
        });
      }

      const showVocab = activeTab === 'all' || activeTab === 'vocab';
      const showDerivatives = activeTab === 'all' || activeTab === 'derivatives';
      const showMyVocab = activeTab === 'my-vocab';
      const showCurriculum = activeTab === 'all' || activeTab === 'curriculum';
      const showStories = activeTab === 'all' || activeTab === 'stories';
      const showNewspaper = (activeTab === 'all' || activeTab === 'newspaper') && lvl.id !== 'beginner';

      const exploredLevelCount = lvl.words.filter((w) => AppState.tracker.exploredWordIds.includes(w.id)).length;
      const levelProgressPct = Math.round((exploredLevelCount / lvl.words.length) * 100);

      mount.innerHTML = `
        <div class="space-y-8">
          <!-- Sticky Sub-Bar with Quick Level Switcher & Smooth Progress Bar -->
          <div
            class="sticky top-16 z-20 rounded-2xl p-3 border backdrop-blur-md flex flex-wrap items-center justify-between gap-3 shadow-sm"
            style="background-color: rgba(255, 255, 255, 0.95); border-color: var(--border-subtle);"
          >
            <a
              href="index.html"
              class="font-bengali inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border text-xs font-bold transition-colors hover:border-[#2D5A4C]"
              style="background-color: var(--bg-ivory); border-color: var(--border-subtle); color: var(--ink-primary);"
            >
              &larr; লেভেল নির্বাচন (All Levels)
            </a>

            <!-- Quick Level Switcher Pills -->
            <div class="flex items-center gap-1 overflow-x-auto py-0.5">
              ${LEVEL_META.map((lm) => {
                const isCur = lm.id === levelId;
                return `
                  <button
                    type="button"
                    onclick="switchLevel('${lm.id}')"
                    class="font-bengali px-2.5 py-1 rounded-xl text-xs font-bold transition-all ${
                      isCur
                        ? 'bg-[#2D5A4C] text-white shadow-sm'
                        : 'bg-[#F3EFEA] text-[#5C6660] hover:text-[#1E2421]'
                    }"
                  >
                    ${lm.title}
                  </button>
                `;
              }).join('')}
            </div>

            <!-- Level Progress Bar Widget -->
            <div class="flex items-center gap-2">
              <span class="hidden sm:inline font-bengali text-xs font-semibold" style="color: var(--ink-secondary);">
                অগ্রগতি: <strong id="level-progress-count" class="text-[#2D5A4C]">${exploredLevelCount}/${lvl.words.length}</strong>
              </span>
              <div class="w-20 sm:w-28 h-2 vw-progress-track border border-[#E6E1D8]">
                <div id="level-progress-bar" class="vw-progress-bar" style="width: ${levelProgressPct}%;"></div>
              </div>
            </div>

            <!-- Active Assessment Badge -->
            ${
              assessOpt
                ? `<span class="hidden xl:inline-block font-bengali px-3 py-1 rounded-full text-xs font-semibold border" style="background-color: var(--accent-sage-soft); border-color: rgba(45, 90, 76, 0.22); color: var(--accent-sage);">জ্ঞান স্তর: ${escapeHtml(assessOpt.text)}</span>`
                : ''
            }
          </div>

          <!-- Level Hero Banner -->
          <div class="rounded-3xl p-6 sm:p-8 border flex flex-col sm:flex-row sm:items-center justify-between gap-5" style="background-color: var(--surface-white); border-color: var(--border-subtle);">
            <div class="flex items-start sm:items-center gap-4">
              <div class="shrink-0">${meta.svg}</div>
              <div>
                <span class="badge-${lvl.id} text-[11px] font-bold uppercase tracking-wider px-3 py-0.5 rounded-full inline-block mb-1.5">
                  ${meta.badge}
                </span>
                <h1 class="font-editorial text-2xl sm:text-4xl font-bold" style="color: var(--ink-primary);">
                  ${lvl.title} Vocabulary &amp; Curriculum
                </h1>
                <p class="font-bengali text-xs sm:text-sm mt-1" style="color: var(--ink-secondary);">
                  ${lvl.bengaliSubtitle}
                </p>
              </div>
            </div>

            <!-- Quick Jump to Interactive Practice & Add Words -->
            <div class="flex flex-wrap sm:flex-col gap-2 shrink-0">
              <a
                href="flashcards.html"
                class="vw-btn-primary font-bengali px-4 py-2.5 rounded-2xl text-xs font-bold inline-flex items-center justify-center gap-1.5 text-center"
              >
                <span>3D Flashcards অনুশীলন</span>
                <span>&rarr;</span>
              </a>
              <a
                href="games.html"
                class="font-bengali px-4 py-2.5 rounded-2xl border text-xs font-bold inline-flex items-center justify-center gap-1.5 text-center hover:border-[#2D5A4C]"
                style="background-color: var(--surface-sand); border-color: var(--border-subtle); color: var(--ink-primary);"
              >
                <span>Memory Games খেলুন</span>
                <span>&rarr;</span>
              </a>
              <a
                href="add-words.html?level=${lvl.id}"
                class="font-bengali px-4 py-2.5 rounded-2xl border text-xs font-bold inline-flex items-center justify-center gap-1.5 text-center transition-all hover:border-[#2D5A4C]"
                style="background-color: var(--accent-sage-soft); border-color: rgba(45, 90, 76, 0.25); color: var(--accent-sage);"
              >
                <span>+ নতুন শব্দ যোগ (Add Words)</span>
              </a>
            </div>
          </div>

          <!-- Section Navigation Tabs -->
          <div class="flex flex-wrap items-center gap-2">
            ${tabItems
              .map(
                (t) => `
                  <button
                    type="button"
                    onclick="setFilterTab('${t.id}')"
                    class="vw-section-tab ${activeTab === t.id ? 'active' : ''} font-bengali px-4 py-2 rounded-2xl text-xs sm:text-sm font-bold"
                  >
                    ${t.label}
                  </button>
                `
              )
              .join('')}
          </div>

          <!-- MY VOCAB LIST (DATE GROUPED & REVISION) -->
          ${
            showMyVocab
              ? `
                <section aria-label="My Vocab List & Daily Revision" class="space-y-6">
                  ${typeof renderMyVocabListMarkup === 'function' ? renderMyVocabListMarkup({ containerId: 'learn-my-vocab' }) : ''}
                </section>
              `
              : ''
          }

          <!-- 1. CORE VOCABULARY CARDS -->
          ${
            showVocab
              ? `
                <section aria-label="${lvl.title} Core Vocabulary" class="space-y-5">
                  <div class="flex items-center justify-between">
                    <h2 class="font-editorial text-xl sm:text-2xl font-bold" style="color: var(--ink-primary);">
                      Core Vocabulary Cards
                    </h2>
                    <span class="font-bengali text-xs" style="color: var(--ink-muted);">
                      ৬টি মূল শব্দ, অর্থ, উচ্চারণ ও ১০টি সমার্থক/বিপরীতার্থক
                    </span>
                  </div>
                  ${lvl.words.map((item) => buildVocabularyCardHTML(item)).join('')}
                </section>
              `
              : ''
          }

          <!-- 2. LEVEL-SPECIFIC CURRICULUM MODULES -->
          ${
            showCurriculum
              ? `
                <section aria-label="${lvl.title} Curriculum Modules" class="space-y-6">
                  ${buildCurriculumModulesHTML(lvl)}
                </section>
              `
              : ''
          }

          <!-- 3. STORIES & READING PASSAGES (ALL 4 LEVELS) -->
          ${
            showStories
              ? `
                <section aria-label="${lvl.title} Stories & Reading" class="space-y-6">
                  ${buildStoriesHTML(lvl)}
                </section>
              `
              : ''
          }

          <!-- 4. REAL NEWSPAPER SENTENCES & EDITORIAL ENGLISH (EXCEPT BEGINNER) -->
          ${
            showNewspaper && lvl.newspaperSentences && lvl.newspaperSentences.length
              ? `
                <section aria-label="${lvl.title} Newspaper Sentences" class="space-y-6">
                  ${buildNewspaperSentencesHTML(lvl)}
                </section>
              `
              : ''
          }

          <!-- 5. DERIVATIVES (WORD FAMILY) ACADEMIC STUDY SETS -->
          ${
            showDerivatives
              ? `
                <section aria-label="${lvl.title} Derivatives Word Family" class="space-y-6" id="derivatives-section">
                  ${buildDerivativesTabHTML(lvl)}
                </section>
              `
              : ''
          }

          <!-- Practice CTA Banner -->
          <div class="rounded-3xl p-6 sm:p-8 border text-center space-y-4" style="background-color: var(--surface-white); border-color: var(--border-subtle);">
            <span class="badge-${lvl.id} text-[11px] font-bold uppercase tracking-wider px-3 py-0.5 rounded-full inline-block">
              TEST YOUR RETENTION &bull; স্মৃতি পরীক্ষা ও অনুশীলন
            </span>
            <h3 class="font-editorial text-2xl sm:text-3xl font-bold" style="color: var(--ink-primary);">
              Ready to Practice These Words?
            </h3>
            <p class="font-bengali text-xs sm:text-sm max-w-xl mx-auto" style="color: var(--ink-secondary);">
              ৩ডি ফ্ল্যাশকার্ড দিয়ে রিভিশন দিন অথবা ওয়ার্ড ম্যাচিং, মিসিং লেটারস, কুইজ এবং স্ক্র্যাম্বল গেম খেলে স্কোর বাড়ান!
            </p>
            <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
              <a
                href="flashcards.html"
                class="vw-btn-primary font-bengali px-6 py-3 rounded-2xl text-xs sm:text-sm font-bold inline-flex items-center gap-2"
              >
                <span>3D Flashcards শুরু করুন</span>
                <span>&rarr;</span>
              </a>
              <a
                href="games.html"
                class="font-bengali px-6 py-3 rounded-2xl border text-xs sm:text-sm font-bold inline-flex items-center gap-2 hover:border-[#2D5A4C]"
                style="background-color: var(--surface-sand); border-color: var(--border-subtle); color: var(--ink-primary);"
              >
                <span>৪টি মেমোরি গেম খেলুন</span>
                <span>&rarr;</span>
              </a>
            </div>
          </div>

          <!-- Compact Daily Study Tracker Strip -->
          ${buildCompactTrackerHTML()}
        </div>
      `;

      if (showVocab && typeof WordImageLoader !== 'undefined') {
        WordImageLoader.mountAll(lvl.words);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderAppHeader('learn');
      renderAppFooter();
      renderLearnPage();
      if (typeof WarmupExam !== 'undefined' && typeof WarmupExam.checkAndTrigger === 'function') {
        WarmupExam.checkAndTrigger();
      }
    });
  </script>
</body>
</html>
